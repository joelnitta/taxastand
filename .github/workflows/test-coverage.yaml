# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      # Work around slow azure.archive.ubuntu.com apt mirrors on GitHub-hosted
      # Ubuntu runners (https://github.com/actions/runner-images/issues/14823):
      # apt's timeout never fires on a mirror that is merely slow, so it never
      # fails over to archive.ubuntu.com. Drop the Azure mirror (keeping at
      # least one other) so downloads go straight to archive.ubuntu.com.
      # Remove once that issue is resolved.
      - name: Avoid slow Azure apt mirror
        if: runner.os == 'Linux'
        run: |
          f=/etc/apt/apt-mirrors.txt
          echo "Before:"; cat "$f" || true
          if [ -f "$f" ] && grep -qv 'azure\.archive\.ubuntu\.com' "$f"; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$f"
          fi
          echo "After:"; cat "$f" || true

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
